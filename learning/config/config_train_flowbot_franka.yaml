
# Dataset
dataset_path: "data/demo_data/Task3/dataset.zarr"  # Path to training dataset (Zarr format), collected with --arm franka
obs_horizon: 2        # Number of observation frames
pred_horizon: 16      # Number of action steps to predict
action_horizon: 8     # Number of action steps to execute
image_size: [216, 288]  # Center crop from 480x640
exclude_episodes: []  # Episodes to exclude from training (e.g. incomplete)

# Arm: 'franka' selects Franka (dataset.py, model.py, deploy script all
# branch on this). A checkpoint trained with arm: franka is only valid for
# --arm franka at deploy time.
arm: franka

# Franka action space -- both are always available in any Franka dataset (no
# recollection needed to switch), see dataset.py's class docstring:
#   'joint_velocity' (default): 7D joint velocities, rad/s, from data/action
#       (see demo_collect.py's _servo_toward / hardware/franka_robot.py's
#       get_joint_velocities() docstrings). action_dim = 7 + 3 (pwm) + 2 (op_mode) = 12.
#   'position': TCP[:tcp_dims] one step ahead, from data/robot_eef_pose (the
#       measured next position -- there's no commanded position target under
#       velocity-control teleop). Same action shape as UR5e's, so a checkpoint
#       trained this way can reuse UR5e's TCP-position execution at deploy time.
#       action_dim = tcp_dims + 3 (pwm) + 2 (op_mode) -- see action_dim below.
franka_action_space: joint_velocity

# Cameras: demo_collect.py always records camera_0 (global); camera_1 (wrist)
# is present only if collected with the wrist camera connected (not
# --no_camera_wrist). 'global' (camera_0 only), 'wrist' (camera_1 only), or
# 'both' -- dataset.py raises a clear error at load time if the dataset is
# missing a camera this setting needs.
camera_mode: both

# Crop + resize (global camera): crop_scale is the crop window size as a
# multiple of image_size; crop_x/crop_y anchor it in [0,1] (0=left/top,
# 0.5=center, 1=right/bottom). Defaults below match dataset.py's own.
image_size: [240, 320]
crop_scale: 1.5
crop_x: 0.5
crop_y: 0.5

# Wrist camera overrides (only used when camera_mode is 'wrist' or 'both').
# Leave unset (or delete) to reuse the global image_size/crop_scale/crop_x/crop_y above.
wrist_image_size: [240, 320]
wrist_crop_scale: 2
wrist_crop_x: 1
wrist_crop_y: 1

# TCP dimensions: 3 = xyz only, 6 = xyz + rotation (rx,ry,rz)
# Always affects STATE (robot_eef_pose[:tcp_dims]). Affects ACTION too when
# franka_action_space: position (TCP[:tcp_dims]) -- but NOT when
# franka_action_space: joint_velocity, which is always the full 7D
# regardless of tcp_dims (train.py checks action_dim below matches whichever
# applies and raises a clear error if not).
tcp_dims: 3           # 3 → xyz only state (8D); 6 → xyz+rotation state (11D)

# Model architecture
# state_dim = tcp_dims(3) + flowbot PWM (3) + operation_mode (2) = 8
# action_dim depends on franka_action_space (train.py validates this against
# the dataset and errors out on a mismatch):
#   joint_velocity: 7 (joint velocities, rad/s) + pwm (3) + op_mode (2) = 12
#   position:       tcp_dims(3) + pwm (3) + op_mode (2) = 8   (or 11 if tcp_dims: 6)
action_dim: 12
state_dim: 8
vision_feature_dim: 512
state_feature_dim: 128
num_diffusion_iters: 100  # Number of diffusion training steps (DDPM)
num_inference_steps: 16   # Number of inference steps (DDIM - 6x faster)
use_resnet: true          # Use ResNet18 encoder (true) or custom CNN (false)
random_crop_pad: 20       # Random crop padding pixels (0 = disabled); pads by 20px then crops back to original size

# UNet variant (FiLM = Stanford-style, recommended)
use_film_unet: true       # true = ConditionalUNet1D (FiLM), false = DiffusionUNet1D (simple)
film_step_embed_dim: 256  # Timestep embedding dim for FiLM UNet (Stanford: 256)
film_kernel_size: 5       # Conv kernel size for FiLM UNet (Stanford: 5)
# film_down_dims: [256, 512, 1024]  # Channel widths for FiLM UNet (default if unset)

# Vision pooling (auto: SpatialSoftmax when use_film_unet=true)
use_spatial_softmax: true # null = auto (true if use_film_unet else false); or override explicitly
num_keypoints: 32         # SpatialSoftmax keypoints → 64-D per frame (Stanford default)

# Training
num_epochs: 3000
batch_size: 64
learning_rate: 5.0e-5  # Peak LR reached after warmup
weight_decay: 1.0e-5   # AdamW weight decay
ema_max_value: 0.9999  # EMA adaptive decay upper bound (UNet-only, Stanford default)
seed: 42

# LR schedule: linear warmup → cosine decay
warmup_epochs: 20     # Linear warmup from 0 → peak_lr over first 500 epochs (~16%)
lr_min_factor: 0.01    # Cosine decays to peak_lr * 0.01 at the end

# Data
val_ratio: 0.1        # Validation split ratio
num_workers: 4        # DataLoader workers

# Early stopping
early_stopping_patience: 50  # Stop if no improvement for N post-warmup epochs (0 = disabled)

# Checkpointing
output_dir: "/media/protac/Desk SSD/Nhan/trained_models_franka"
save_every: 200        # Save checkpoint every N epochs
